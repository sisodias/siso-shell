{{!-- atom · section head — every section on a page uses this so "On this page" can be built from <section class="siso-section" id>.
     Data: {id,n,title,sub} (the caller wraps its body) --}}
<div class="siso-section__head"><span class="n">{{n}}</span><h2>{{title}}</h2>{{#if sub}}<span class="sub">{{{sub}}}</span>{{/if}}</div>
